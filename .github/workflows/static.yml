name: static

# Runs on every pull request, forks included, and on pushes. It needs no
# secret: catalog.json x index/ x plugins/, the repository's secret scan and
# gitleaks over the whole history. Never switch this to pull_request_target.
on:
  pull_request:
  push:
    branches: [main]

permissions:
  contents: read

jobs:
  static:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0 # gitleaks reads the whole history
          persist-credentials: false

      - name: Catalog and secret scan
        run: scripts/check.sh static

      - uses: actions/setup-go@v5
        with:
          go-version: "1.25"
          cache: false

      # go install checks the module against the Go checksum database.
      - name: Install gitleaks
        run: go install github.com/zricethezav/gitleaks/v8@v8.30.1

      - name: gitleaks over the whole history
        run: >-
          "$(go env GOPATH)/bin/gitleaks" git . --log-opts="--all"
          --redact --no-banner -v
